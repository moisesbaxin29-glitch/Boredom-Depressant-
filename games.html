<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Menu - Boredom Depressant</title>
    <!-- Simple Arcade Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container">
        <h1 class="menu-title">SELECT GAME</h1>
        
        <!-- Grid wrapper for our game boxes -->
        <div class="games-grid">
            
            <!-- Game Card 1: Reaction Time -->
            <div class="game-card blue-glow">
                <h2 class="game-name">REACTION TEST</h2>
                <p class="game-desc">Test your reflex speeds through 5 unique, trickier interactive levels!</p>
                <a href="reaction.html" class="play-btn-small">PLAY</a>
            </div>

            <!-- Game Card 2: Memory Match (Now Unlocked!) -->
            <div class="game-card pink-glow">
                <h2 class="game-name">MEMORY MATCH</h2>
                <p class="game-desc">Flip the retro cards and match all the pairs before time runs out!</p>
                <a href="memory.html" class="play-btn-small">PLAY</a>
            </div>

            <!-- Game Card 3: Dodge Box -->
            <div class="game-card green-glow">
                <h2 class="game-name">DODGE BOX</h2>
                <p class="game-desc">Avoid the falling obstacles and stay alive as long as possible!</p>
                <button class="play-btn-small locked">LOCKED</button>
            </div>

        </div>

        <!-- Back Button to go home -->
        <div class="back-container">
            <a href="index.html" class="back-link">← BACK TO HOME</a>
        </div>
    </div>

</body>
</html>
